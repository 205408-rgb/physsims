<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gas Laws Lab | Physics Simulations</title>
  <style>
    :root {
      --bg: #fcfcf9;
      --panel: #ffffff;
      --canvas: #f7f7f4;
      --border: #e2e2dc;
      --border-subtle: #eee;
      --text: #1a1a1a;
      --muted: #707070;
      --accent: #2b5c8f;
      --accent-light: #eaf1f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: auto;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 36px 0 24px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 2.75rem);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.25rem;
      color: var(--text);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .back {
      color: var(--text);
      background: #f0f0eb;
      border: 1px solid var(--border);
      text-decoration: none;
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .back:hover { background: #e5e5df; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(300px, 0.9fr);
      gap: 24px;
      padding-top: 28px;
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 2px;
    }

    #simCanvas {
      display: block;
      width: 100%;
      height: 480px;
      background: var(--canvas);
    }

    .simulation {
      position: relative;
    }

    .canvas-label {
      position: absolute;
      top: 14px;
      left: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .controls { 
      padding: 24px; 
      display: flex;
      flex-direction: column;
    }

    .control { margin-bottom: 22px; }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 0.88rem;
    }

    output {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      cursor: pointer;
      accent-color: #1a1a1a;
      background: #e2e2dc;
      border-radius: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin: 8px 0 24px;
    }

    button {
      flex: 1;
      cursor: pointer;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      padding: 10px 16px;
      color: #ffffff;
      background: #1a1a1a;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.88; }

    button.running {
      background: #a82e2e;
      border-color: #a82e2e;
    }

    button.secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: #f7f7f4;
    }

    button.secondary:hover { background: #ecece6; }

    .checks {
      display: grid;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .checks label {
      justify-content: flex-start;
      align-items: center;
      margin: 0;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .checks input { accent-color: #1a1a1a; margin-right: 8px; }

    .readouts {
      margin-top: 20px;
      padding-top: 16px;
    }

    .readouts h3 {
      margin: 0 0 12px;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 400;
      font-size: 1.05rem;
      color: var(--text);
    }

    .readouts p {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .readouts strong { 
      color: var(--text);
      font-variant-numeric: tabular-nums; 
    }

    .formula {
      margin: 20px 0 0;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    @media (max-width: 850px) {
      header { flex-direction: column; gap: 16px; }
      .layout { grid-template-columns: 1fr; }
      #simCanvas { height: 360px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Gas Laws Lab</h1>
        <p class="subtitle">Adjust temperature, volume, and particle count to observe kinetic gas behavior and pressure changes.</p>
      </div>
      <a class="back" href="index.html">← All Simulations</a>
    </header>

    <main class="layout">
      <section class="panel simulation">
        <canvas id="simCanvas"></canvas>
        <div class="canvas-label">Ideal Gas Model</div>
      </section>

      <aside class="panel controls">
        <h2>Controls</h2>

        <div class="control">
          <label for="temperature">
            <span>Temperature</span>
            <output id="temperatureOut">300 K</output>
          </label>
          <input id="temperature" type="range" min="100" max="800" value="300" step="10">
        </div>

        <div class="control">
          <label for="volume">
            <span>Container Volume</span>
            <output id="volumeOut">5.0 L</output>
          </label>
          <input id="volume" type="range" min="2" max="10" value="5" step="0.5">
        </div>

        <div class="control">
          <label for="particleCount">
            <span>Number of Particles</span>
            <output id="particleCountOut">40</output>
          </label>
          <input id="particleCount" type="range" min="10" max="100" value="40" step="5">
        </div>

        <div class="actions">
          <button id="toggleButton" type="button">Start</button>
          <button id="resetButton" class="secondary" type="button">Reset</button>
        </div>

        <div class="checks">
          <label><input id="vectors" type="checkbox" checked> Show velocity vectors</label>
          <label><input id="trails" type="checkbox"> Show trails</label>
          <label><input id="meter" type="checkbox" checked> Show pressure gauge</label>
        </div>

        <section class="readouts">
          <h3>Readouts</h3>
          <p><span>Pressure</span><strong id="pressureOut">0.00 kPa</strong></p>
          <p><span>Average Speed</span><strong id="speedOut">0.00 units/s</strong></p>
          <p><span>Active Particles</span><strong id="countOut">0</strong></p>
          <p><span>Relative PV / NT</span><strong id="ratioOut">1.00</strong></p>
        </section>

        <p class="formula">
          Ideal Gas Relation: P ∝ NT / V
        </p>
      </aside>
    </main>
  </div>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");

    const temperatureInput = document.getElementById("temperature");
    const volumeInput = document.getElementById("volume");
    const particleCountInput = document.getElementById("particleCount");
    const vectorsInput = document.getElementById("vectors");
    const trailsInput = document.getElementById("trails");
    const meterInput = document.getElementById("meter");

    const temperatureOut = document.getElementById("temperatureOut");
    const volumeOut = document.getElementById("volumeOut");
    const particleCountOut = document.getElementById("particleCountOut");

    const pressureOut = document.getElementById("pressureOut");
    const speedOut = document.getElementById("speedOut");
    const countOut = document.getElementById("countOut");
    const ratioOut = document.getElementById("ratioOut");

    const toggleButton = document.getElementById("toggleButton");
    const resetButton = document.getElementById("resetButton");

    const PARTICLE_RADIUS = 4;
    let particles = [];
    let isRunning = false;
    let lastTime = null;

    function getValues() {
      return {
        temperature: Number(temperatureInput.value),
        volume: Number(volumeInput.value),
        particleCount: Number(particleCountInput.value)
      };
    }

    function getCanvasSize() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      return {
        width: rect.width,
        height: rect.height
      };
    }

    function getContainer(v, width, height) {
      const top = height * 0.16;
      const bottom = height * 0.84;

      const minWidth = width * 0.30;
      const maxWidth = width * 0.72;

      const fraction = (v.volume - 2) / 8;
      const containerWidth = minWidth + fraction * (maxWidth - minWidth);

      return {
        x: (width - containerWidth) / 2,
        y: top,
        width: containerWidth,
        height: bottom - top
      };
    }

    function targetSpeed(temperature) {
      return 60 + Math.sqrt(temperature) * 4.5;
    }

    function newParticle(box, speed) {
      const direction = Math.random() * Math.PI * 2;
      const randomSpeed = speed * (0.7 + Math.random() * 0.6);

      return {
        x: box.x + PARTICLE_RADIUS + 4 + Math.random() * Math.max(1, box.width - 2 * PARTICLE_RADIUS - 8),
        y: box.y + PARTICLE_RADIUS + 4 + Math.random() * Math.max(1, box.height - 2 * PARTICLE_RADIUS - 8),
        vx: Math.cos(direction) * randomSpeed,
        vy: Math.sin(direction) * randomSpeed,
        trail: []
      };
    }

    function resetParticles() {
      const size = getCanvasSize();
      const v = getValues();
      const box = getContainer(v, size.width, size.height);
      const speed = targetSpeed(v.temperature);

      particles = [];
      for (let i = 0; i < v.particleCount; i++) {
        particles.push(newParticle(box, speed));
      }
    }

    function syncParticles(v, box) {
      const target = v.particleCount;
      const speed = targetSpeed(v.temperature);

      while (particles.length < target) {
        particles.push(newParticle(box, speed));
      }
      while (particles.length > target) {
        particles.pop();
      }

      // Ensure particles are clamped inside box bounds if volume changes
      const minX = box.x + PARTICLE_RADIUS + 2;
      const maxX = box.x + box.width - PARTICLE_RADIUS - 2;
      const minY = box.y + PARTICLE_RADIUS + 2;
      const maxY = box.y + box.height - PARTICLE_RADIUS - 2;

      particles.forEach(p => {
        if (p.x < minX) p.x = minX;
        if (p.x > maxX) p.x = maxX;
        if (p.y < minY) p.y = minY;
        if (p.y > maxY) p.y = maxY;
      });
    }

    function updateParticles(delta, v, box) {
      if (!isRunning) return;

      const speedGoal = targetSpeed(v.temperature);

      const minX = box.x + PARTICLE_RADIUS;
      const maxX = box.x + box.width - PARTICLE_RADIUS;
      const minY = box.y + PARTICLE_RADIUS;
      const maxY = box.y + box.height - PARTICLE_RADIUS;

      particles.forEach(particle => {
        const currentSpeed = Math.hypot(particle.vx, particle.vy);

        if (currentSpeed > 0.001) {
          const factor = speedGoal / currentSpeed;
          particle.vx += (particle.vx * factor - particle.vx) * 0.04;
          particle.vy += (particle.vy * factor - particle.vy) * 0.04;
        }

        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;

        // Collision logic with pushback offset (+1px) to prevent wall sticking
        if (particle.x <= minX) {
          particle.x = minX + 1.0;
          particle.vx = Math.abs(particle.vx);
        } else if (particle.x >= maxX) {
          particle.x = maxX - 1.0;
          particle.vx = -Math.abs(particle.vx);
        }

        if (particle.y <= minY) {
          particle.y = minY + 1.0;
          particle.vy = Math.abs(particle.vy);
        } else if (particle.y >= maxY) {
          particle.y = maxY - 1.0;
          particle.vy = -Math.abs(particle.vy);
        }

        if (trailsInput.checked) {
          particle.trail.push({ x: particle.x, y: particle.y });
          if (particle.trail.length > 15) particle.trail.shift();
        } else {
          particle.trail = [];
        }
      });
    }

    function drawArrow(ctx, fromX, fromY, toX, toY, color) {
      const headLength = 5;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      
      if (Math.hypot(dx, dy) < 2) return;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.2;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function draw(v, box, width, height) {
      const pressure = isRunning ? (0.004 * v.particleCount * v.temperature / v.volume) : 0;

      const averageSpeed = isRunning ? (
        particles.reduce((total, p) => total + Math.hypot(p.vx, p.vy), 0) / Math.max(particles.length, 1)
      ) : 0;

      temperatureOut.textContent = `${v.temperature.toFixed(0)} K`;
      volumeOut.textContent = `${v.volume.toFixed(1)} L`;
      particleCountOut.textContent = `${v.particleCount}`;

      pressureOut.textContent = `${pressure.toFixed(2)} kPa`;
      speedOut.textContent = `${averageSpeed.toFixed(1)} units/s`;
      countOut.textContent = particles.length;
      ratioOut.textContent = "1.00";

      ctx.clearRect(0, 0, width, height);

      // Light grid pattern matching the Collision Lab
      ctx.strokeStyle = "#ebebe5";
      ctx.lineWidth = 1;
      const gridSize = 24;

      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Container background and outline
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(box.x, box.y, box.width, box.height);

      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 2;
      ctx.strokeRect(box.x, box.y, box.width, box.height);

      // Render Trails
      if (trailsInput.checked && isRunning) {
        particles.forEach(particle => {
          if (particle.trail.length < 2) return;

          ctx.strokeStyle = "rgba(43, 92, 143, 0.25)";
          ctx.lineWidth = 1;
          ctx.beginPath();

          particle.trail.forEach((point, index) => {
            if (index === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
          });
          ctx.stroke();
        });
      }

      // Render Particles & Velocity Vectors
      particles.forEach(particle => {
        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, PARTICLE_RADIUS, 0, Math.PI * 2);
        ctx.fill();

        if (vectorsInput.checked && isRunning) {
          const vectorScale = 0.1;
          const endX = particle.x + particle.vx * vectorScale;
          const endY = particle.y + particle.vy * vectorScale;
          drawArrow(ctx, particle.x, particle.y, endX, endY, "#2b5c8f");
        }
      });

      // Render Pressure Gauge
      if (meterInput.checked) {
        const meterX = width * 0.06;
        const meterY = height * 0.22;
        const meterWidth = 16;
        const meterHeight = height * 0.56;
        const maximumPressure = 20;
        const fill = Math.min(1, pressure / maximumPressure);

        ctx.strokeStyle = "#1a1a1a";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(meterX, meterY, meterWidth, meterHeight);

        ctx.fillStyle = "#2b5c8f";
        ctx.fillRect(
          meterX + 2,
          meterY + meterHeight * (1 - fill),
          meterWidth - 4,
          meterHeight * fill
        );

        ctx.fillStyle = "#707070";
        ctx.font = "11px system-ui";
        ctx.fillText("P", meterX + 4, meterY - 8);
        ctx.fillText(`${pressure.toFixed(1)}`, meterX - 6, meterY + meterHeight + 18);
      }

      ctx.fillStyle = "#707070";
      ctx.font = "12px system-ui";
      ctx.fillText("GAS CONTAINER", box.x, box.y - 10);
    }

    function animate(timestamp) {
      if (lastTime === null) lastTime = timestamp;

      const delta = Math.min((timestamp - lastTime) / 1000, 0.04);
      lastTime = timestamp;

      const size = getCanvasSize();
      const v = getValues();
      const box = getContainer(v, size.width, size.height);

      syncParticles(v, box);
      updateParticles(delta, v, box);
      draw(v, box, size.width, size.height);

      requestAnimationFrame(animate);
    }

    toggleButton.addEventListener("click", () => {
      isRunning = !isRunning;
      if (isRunning) {
        toggleButton.textContent = "Pause";
        toggleButton.classList.add("running");
      } else {
        toggleButton.textContent = "Start";
        toggleButton.classList.remove("running");
      }
    });

    resetButton.addEventListener("click", () => {
      isRunning = false;
      toggleButton.textContent = "Start";
      toggleButton.classList.remove("running");
      resetParticles();
    });

    [temperatureInput, volumeInput, particleCountInput].forEach(input => {
      input.addEventListener("input", () => {
        const size = getCanvasSize();
        const v = getValues();
        const box = getContainer(v, size.width, size.height);
        syncParticles(v, box);
      });
    });

    window.addEventListener("resize", () => {
      lastTime = null;
      resetParticles();
    });

    resetParticles();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
