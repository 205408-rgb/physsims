<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnet & Compass</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2e;
      --canvas: #0c1425;
      --border: #263658;
      --text: #f2f7ff;
      --muted: #aebbd3;
      --blue: #61b4ff;
      --green: #61e7b6;
      --red: #ff7b8e;
      --yellow: #ffd56a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 28px 0 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 { margin: 0; font-size: 2.2rem; }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .back {
      color: var(--blue);
      text-decoration: none;
      white-space: nowrap;
      padding-top: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.8fr);
      gap: 18px;
      padding: 22px 0 40px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    #magnetCanvas {
      display: block;
      width: 100%;
      height: 460px;
      background: var(--canvas);
      cursor: grab;
      touch-action: none;
    }

    .controls { padding: 20px; }

    h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
    }

    .control { margin-bottom: 20px; }

    label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    output { color: var(--text); }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #07101e;
      font: inherit;
      font-weight: 700;
    }

    button.secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: transparent;
    }

    .check {
      justify-content: flex-start;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
    }

    .check input { accent-color: var(--blue); }

    .readout {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--canvas);
    }

    .readout h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .readout p {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 7px 0;
      font-size: 0.9rem;
    }

    .help {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      margin-top: 18px;
    }

    @media (max-width: 820px) {
      header { display: block; }
      .back { display: inline-block; margin-top: 12px; }
      .layout { grid-template-columns: 1fr; }
      #magnetCanvas { height: 360px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div>
        <h1>Magnet & Compass</h1>
        <p class="subtitle">Drag the bar magnet and observe compasses and simplified N-to-S field curves.</p>
      </div>
      <a class="back" href="index.html">← All simulations</a>
    </header>

    <main class="layout">
      <section class="panel">
        <canvas id="magnetCanvas"></canvas>
      </section>

      <aside class="panel controls">
        <h2>Controls</h2>

        <div class="control">
          <label for="magnetStrength">
            <span>Magnet strength</span>
            <output id="magnetStrengthOutput">1.0</output>
          </label>
          <input id="magnetStrength" type="range" min="0.2" max="3" value="1" step="0.1">
        </div>

        <div class="control">
          <label for="magnetRotation">
            <span>Magnet rotation</span>
            <output id="magnetRotationOutput">0°</output>
          </label>
          <input id="magnetRotation" type="range" min="0" max="360" value="0" step="1">
        </div>

        <div class="buttons">
          <button id="centreMagnet" type="button">Centre magnet</button>
          <button id="flipMagnet" class="secondary" type="button">Flip poles</button>
        </div>

        <label class="check">
          <input id="displayLoops" type="checkbox" checked>
          Show N → S field curves
        </label>

        <label class="check">
          <input id="displayCompasses" type="checkbox" checked>
          Show compasses
        </label>

        <label class="check">
          <input id="displayArrows" type="checkbox" checked>
          Show field arrows
        </label>

        <section class="readout">
          <h3>Field at centre</h3>
          <p><span>Direction</span><strong id="fieldDirectionOutput">0°</strong></p>
          <p><span>Magnitude</span><strong id="fieldMagnitudeOutput">0.00</strong></p>
          <p><span>North pole</span><strong id="northPoleOutput">Right</strong></p>
        </section>

        <p class="help">
          Green curves are a simplified visual guide. Outside a bar magnet, field direction is from north to south.
        </p>
      </aside>
    </main>
  </div>

  <script>
    const magnetCanvas = document.getElementById("magnetCanvas");
    const magnetContext = magnetCanvas.getContext("2d");

    const magnetStrengthInput = document.getElementById("magnetStrength");
    const magnetRotationInput = document.getElementById("magnetRotation");

    const showLoopsInput = document.getElementById("displayLoops");
    const showCompassesInput = document.getElementById("displayCompasses");
    const showArrowsInput = document.getElementById("displayArrows");

    const strengthDisplay = document.getElementById("magnetStrengthOutput");
    const rotationDisplay = document.getElementById("magnetRotationOutput");

    const directionDisplay = document.getElementById("fieldDirectionOutput");
    const magnitudeDisplay = document.getElementById("fieldMagnitudeOutput");
    const northPoleDisplay = document.getElementById("northPoleOutput");

    let magnetPositionX = 0.5;
    let magnetPositionY = 0.5;
    let magnetIsFlipped = false;
    let draggingMagnet = false;

    function resizeMagnetCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      const bounds = magnetCanvas.getBoundingClientRect();

      magnetCanvas.width = Math.round(bounds.width * pixelRatio);
      magnetCanvas.height = Math.round(bounds.height * pixelRatio);

      magnetContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      return {
        width: bounds.width,
        height: bounds.height
      };
    }

    function getMagnetSettings() {
      return {
        strength: Number(magnetStrengthInput.value),
        angle: Number(magnetRotationInput.value) * Math.PI / 180
      };
    }

    function getMagnetPoles(width, height, settings) {
      const centreX = magnetPositionX * width;
      const centreY = magnetPositionY * height;
      const halfLength = 62;

      const offsetX = Math.cos(settings.angle) * halfLength;
      const offsetY = Math.sin(settings.angle) * halfLength;

      let northPole = {
        x: centreX + offsetX,
        y: centreY + offsetY
      };

      let southPole = {
        x: centreX - offsetX,
        y: centreY - offsetY
      };

      if (magnetIsFlipped) {
        const previousNorth = northPole;
        northPole = southPole;
        southPole = previousNorth;
      }

      return {
        centreX,
        centreY,
        northPole,
        southPole
      };
    }

    function magneticFieldAt(x, y, width, height, settings) {
      const poles = getMagnetPoles(width, height, settings);

      const northDx = x - poles.northPole.x;
      const northDy = y - poles.northPole.y;

      const southDx = x - poles.southPole.x;
      const southDy = y - poles.southPole.y;

      const northDistanceSquared =
        northDx * northDx + northDy * northDy + 900;

      const southDistanceSquared =
        southDx * southDx + southDy * southDy + 900;

      const northDistance = Math.sqrt(northDistanceSquared);
      const southDistance = Math.sqrt(southDistanceSquared);

      const fieldX =
        settings.strength * northDx / (northDistanceSquared * northDistance) -
        settings.strength * southDx / (southDistanceSquared * southDistance);

      const fieldY =
        settings.strength * northDy / (northDistanceSquared * northDistance) -
        settings.strength * southDy / (southDistanceSquared * southDistance);

      return {
        x: fieldX,
        y: fieldY,
        magnitude: Math.hypot(fieldX, fieldY)
      };
    }

    function drawArrow(x1, y1, x2, y2, colour, lineWidth = 1.5, arrowSize = 5) {
      const arrowAngle = Math.atan2(y2 - y1, x2 - x1);

      magnetContext.strokeStyle = colour;
      magnetContext.lineWidth = lineWidth;
      magnetContext.beginPath();
      magnetContext.moveTo(x1, y1);
      magnetContext.lineTo(x2, y2);
      magnetContext.stroke();

      magnetContext.fillStyle = colour;
      magnetContext.beginPath();
      magnetContext.moveTo(x2, y2);
      magnetContext.lineTo(
        x2 - arrowSize * Math.cos(arrowAngle - Math.PI / 6),
        y2 - arrowSize * Math.sin(arrowAngle - Math.PI / 6)
      );
      magnetContext.lineTo(
        x2 - arrowSize * Math.cos(arrowAngle + Math.PI / 6),
        y2 - arrowSize * Math.sin(arrowAngle + Math.PI / 6)
      );
      magnetContext.closePath();
      magnetContext.fill();
    }

    function bezierPoint(start, controlOne, controlTwo, end, t) {
      const inverseT = 1 - t;

      return {
        x:
          inverseT * inverseT * inverseT * start.x +
          3 * inverseT * inverseT * t * controlOne.x +
          3 * inverseT * t * t * controlTwo.x +
          t * t * t * end.x,

        y:
          inverseT * inverseT * inverseT * start.y +
          3 * inverseT * inverseT * t * controlOne.y +
          3 * inverseT * t * t * controlTwo.y +
          t * t * t * end.y
      };
    }

    function bezierTangent(start, controlOne, controlTwo, end, t) {
      const inverseT = 1 - t;

      return {
        x:
          3 * inverseT * inverseT * (controlOne.x - start.x) +
          6 * inverseT * t * (controlTwo.x - controlOne.x) +
          3 * t * t * (end.x - controlTwo.x),

        y:
          3 * inverseT * inverseT * (controlOne.y - start.y) +
          6 * inverseT * t * (controlTwo.y - controlOne.y) +
          3 * t * t * (end.y - controlTwo.y)
      };
    }

    function drawSingleFieldCurve(northPole, southPole, bend) {
      const lineX = southPole.x - northPole.x;
      const lineY = southPole.y - northPole.y;
      const lineLength = Math.hypot(lineX, lineY) || 1;

      const perpendicularX = -lineY / lineLength;
      const perpendicularY = lineX / lineLength;

      const controlOne = {
        x: northPole.x + lineX * 0.28 + perpendicularX * bend,
        y: northPole.y + lineY * 0.28 + perpendicularY * bend
      };

      const controlTwo = {
        x: northPole.x + lineX * 0.72 + perpendicularX * bend,
        y: northPole.y + lineY * 0.72 + perpendicularY * bend
      };

      magnetContext.strokeStyle = "rgba(97, 231, 182, 0.65)";
      magnetContext.lineWidth = 1.5;
      magnetContext.beginPath();
      magnetContext.moveTo(northPole.x, northPole.y);
      magnetContext.bezierCurveTo(
        controlOne.x,
        controlOne.y,
        controlTwo.x,
        controlTwo.y,
        southPole.x,
        southPole.y
      );
      magnetContext.stroke();

      const middlePoint = bezierPoint(
        northPole,
        controlOne,
        controlTwo,
        southPole,
        0.5
      );

      const middleTangent = bezierTangent(
        northPole,
        controlOne,
        controlTwo,
        southPole,
        0.5
      );

      const tangentLength =
        Math.hypot(middleTangent.x, middleTangent.y) || 1;

      drawArrow(
        middlePoint.x - middleTangent.x / tangentLength * 8,
        middlePoint.y - middleTangent.y / tangentLength * 8,
        middlePoint.x + middleTangent.x / tangentLength * 8,
        middlePoint.y + middleTangent.y / tangentLength * 8,
        "rgba(97, 231, 182, 1)",
        1.5,
        6
      );
    }

    function drawFieldCurves(width, height, settings) {
      const poles = getMagnetPoles(width, height, settings);
      const baseBend = Math.min(width, height) * 0.10;

      const bends = [
        -baseBend * 0.7,
        -baseBend * 1.4,
        -baseBend * 2.1,
        -baseBend * 2.8,
        baseBend * 0.7,
        baseBend * 1.4,
        baseBend * 2.1,
        baseBend * 2.8
      ];

      bends.forEach(bend => {
        drawSingleFieldCurve(
          poles.northPole,
          poles.southPole,
          bend
        );
      });
    }

    function drawFieldArrows(width, height, settings) {
      const spacing = 50;

      for (let x = spacing / 2; x < width; x += spacing) {
        for (let y = spacing / 2; y < height; y += spacing) {
          const field = magneticFieldAt(x, y, width, height, settings);

          if (field.magnitude < 0.000001) continue;

          const arrowLength = 13;

          drawArrow(
            x,
            y,
            x + field.x / field.magnitude * arrowLength,
            y + field.y / field.magnitude * arrowLength,
            "rgba(97, 180, 255, 0.58)",
            1,
            4
          );
        }
      }
    }

    function drawCompass(x, y, field) {
      if (field.magnitude < 0.000001) return;

      const compassAngle = Math.atan2(field.y, field.x);

      magnetContext.fillStyle = "rgba(18, 26, 46, 0.95)";
      magnetContext.strokeStyle = "rgba(174, 187, 211, 0.7)";
      magnetContext.lineWidth = 1.2;

      magnetContext.beginPath();
      magnetContext.arc(x, y, 10, 0, Math.PI * 2);
      magnetContext.fill();
      magnetContext.stroke();

      drawArrow(
        x - Math.cos(compassAngle) * 7,
        y - Math.sin(compassAngle) * 7,
        x + Math.cos(compassAngle) * 7,
        y + Math.sin(compassAngle) * 7,
        "#ff7b8e",
        2,
        4
      );
    }

    function drawCompasses(width, height, settings) {
      const spacing = 85;

      for (let x = spacing / 2; x < width; x += spacing) {
        for (let y = spacing / 2; y < height; y += spacing) {
          const field = magneticFieldAt(x, y, width, height, settings);
          drawCompass(x, y, field);
        }
      }
    }

    function drawBarMagnet(width, height, settings) {
      const poles = getMagnetPoles(width, height, settings);
      const length = 128;
      const thickness = 35;

      magnetContext.save();
      magnetContext.translate(poles.centreX, poles.centreY);
      magnetContext.rotate(settings.angle);

      const rightSideIsNorth = !magnetIsFlipped;

      magnetContext.fillStyle =
        rightSideIsNorth ? "#61b4ff" : "#ff7b8e";

      magnetContext.fillRect(
        -length / 2,
        -thickness / 2,
        length / 2,
        thickness
      );

      magnetContext.fillStyle =
        rightSideIsNorth ? "#ff7b8e" : "#61b4ff";

      magnetContext.fillRect(
        0,
        -thickness / 2,
        length / 2,
        thickness
      );

      magnetContext.strokeStyle = "#06101d";
      magnetContext.lineWidth = 2;
      magnetContext.strokeRect(
        -length / 2,
        -thickness / 2,
        length,
        thickness
      );

      magnetContext.fillStyle = "#ffffff";
      magnetContext.font = "bold 16px system-ui";

      magnetContext.fillText(
        rightSideIsNorth ? "S" : "N",
        -37,
        6
      );

      magnetContext.fillText(
        rightSideIsNorth ? "N" : "S",
        27,
        6
      );

      magnetContext.restore();
    }

    function renderMagnetSimulation() {
      const canvasSize = resizeMagnetCanvas();
      const width = canvasSize.width;
      const height = canvasSize.height;
      const settings = getMagnetSettings();

      magnetContext.clearRect(0, 0, width, height);

      magnetContext.fillStyle = "#0c1425";
      magnetContext.fillRect(0, 0, width, height);

      magnetContext.strokeStyle = "rgba(174,187,211,0.10)";
      magnetContext.lineWidth = 1;

      for (let x = 0; x < width; x += 50) {
        magnetContext.beginPath();
        magnetContext.moveTo(x, 0);
        magnetContext.lineTo(x, height);
        magnetContext.stroke();
      }

      for (let y = 0; y < height; y += 50) {
        magnetContext.beginPath();
        magnetContext.moveTo(0, y);
        magnetContext.lineTo(width, y);
        magnetContext.stroke();
      }

      if (showLoopsInput.checked) {
        drawFieldCurves(width, height, settings);
      }

      if (showArrowsInput.checked) {
        drawFieldArrows(width, height, settings);
      }

      if (showCompassesInput.checked) {
        drawCompasses(width, height, settings);
      }

      drawBarMagnet(width, height, settings);

      const centreField = magneticFieldAt(
        width / 2,
        height / 2,
        width,
        height,
        settings
      );

      strengthDisplay.textContent =
        settings.strength.toFixed(1);

      rotationDisplay.textContent =
        `${Number(magnetRotationInput.value).toFixed(0)}°`;

      magnitudeDisplay.textContent =
        centreField.magnitude.toExponential(2);

      directionDisplay.textContent =
        `${(Math.atan2(centreField.y, centreField.x) * 180 / Math.PI).toFixed(0)}°`;

      northPoleDisplay.textContent =
        magnetIsFlipped ? "Left" : "Right";
    }

    function getPointerPosition(event) {
      const rect = magnetCanvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top,
        width: rect.width,
        height: rect.height
      };
    }

    magnetCanvas.addEventListener("pointerdown", event => {
      const pointer = getPointerPosition(event);
      const magnetPixelX = magnetPositionX * pointer.width;
      const magnetPixelY = magnetPositionY * pointer.height;

      if (
        Math.hypot(
          pointer.x - magnetPixelX,
          pointer.y - magnetPixelY
        ) < 95
      ) {
        draggingMagnet = true;
        magnetCanvas.setPointerCapture(event.pointerId);
      }
    });

    magnetCanvas.addEventListener("pointermove", event => {
      if (!draggingMagnet) return;

      const pointer = getPointerPosition(event);

      magnetPositionX = Math.max(
        0.16,
        Math.min(0.84, pointer.x / pointer.width)
      );

      magnetPositionY = Math.max(
        0.16,
        Math.min(0.84, pointer.y / pointer.height)
      );

      renderMagnetSimulation();
    });

    magnetCanvas.addEventListener("pointerup", () => {
      draggingMagnet = false;
    });

    magnetCanvas.addEventListener("pointercancel", () => {
      draggingMagnet = false;
    });

    document.getElementById("centreMagnet").addEventListener("click", () => {
      magnetPositionX = 0.5;
      magnetPositionY = 0.5;
      magnetRotationInput.value = 0;
      magnetIsFlipped = false;
      renderMagnetSimulation();
    });

    document.getElementById("flipMagnet").addEventListener("click", () => {
      magnetIsFlipped = !magnetIsFlipped;
      renderMagnetSimulation();
    });

    [
      magnetStrengthInput,
      magnetRotationInput,
      showLoopsInput,
      showCompassesInput,
      showArrowsInput
    ].forEach(input => {
      input.addEventListener("input", renderMagnetSimulation);
    });

    window.addEventListener("resize", renderMagnetSimulation);

    renderMagnetSimulation();
  </script>
</body>
</html>
